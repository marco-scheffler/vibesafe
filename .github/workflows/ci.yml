name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit (hermetic)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit + integration tests (no network, no scanners)
        env:
          VIBESAFE_NO_EPHEMERAL: "1"
        run: python -m unittest discover -s tests -v

  live-detection:
    name: live detection (real scanners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # gitleaks (secrets) — 8.19+ needed for the `dir` subcommand scan.py uses
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/bin" gitleaks
          # trivy (iac / misconfig / license)
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin"
          # osv-scanner (deps)
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.8.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # semgrep (sast) — pip so it lands on the setup-python PATH
          pip install semgrep
          # govulncheck (Go deps, reachability) — Go is preinstalled on ubuntu-latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # cargo-audit (Rust deps) — prebuilt binary, no compile
          mkdir -p /tmp/ca
          curl -sSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            | tar -xz -C /tmp/ca
          cp "$(find /tmp/ca -name cargo-audit -type f | head -1)" "$HOME/bin/cargo-audit"
          chmod +x "$HOME/bin/cargo-audit"
          # bundler-audit (Ruby deps) — Ruby is preinstalled on ubuntu-latest
          sudo gem install --no-document bundler-audit
          bundler-audit update
          # composer audit (PHP deps) — PHP + latest Composer (>=2.4 for `audit`)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli
          curl -sS https://getcomposer.org/installer | php -- --install-dir="$HOME/bin" --filename=composer
          composer --version
          # Java deps are covered by osv-scanner (installed above) — no extra tool
      - name: Prove detection (secrets / sast / deps / iac + Go, Rust, Ruby, PHP, Java)
        env:
          VIBESAFE_LIVE: "1"
        run: python -m unittest tests.test_live_detection -v
