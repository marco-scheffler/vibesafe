name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit (hermetic)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit + integration tests (no network, no scanners)
        env:
          VIBESAFE_NO_EPHEMERAL: "1"
        run: python -m unittest discover -s tests -v

  live-detection:
    name: live detection (real scanners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # gitleaks (secrets) — 8.19+ needed for the `dir` subcommand scan.py uses
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/bin" gitleaks
          # trivy (iac / misconfig / license)
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
            | tar -xz -C "$HOME/bin" trivy
          # osv-scanner (deps)
          curl -sSL -o "$HOME/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$HOME/bin/osv-scanner"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"   # for go-installed govulncheck
          # semgrep (sast) — pip so it lands on the setup-python PATH
          pip install semgrep==1.180.0
          # govulncheck (Go deps, reachability) — Go is preinstalled on ubuntu-latest
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          # cargo-audit (Rust deps) — prebuilt binary, no compile
          mkdir -p /tmp/ca
          curl -sSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            | tar -xz -C /tmp/ca
          cp "$(find /tmp/ca -name cargo-audit -type f | head -1)" "$HOME/bin/cargo-audit"
          chmod +x "$HOME/bin/cargo-audit"
          # bundler-audit (Ruby deps) — Ruby is preinstalled on ubuntu-latest
          sudo gem install --no-document bundler-audit -v 0.9.3
          bundler-audit update
          # composer audit (PHP deps) — PHP + Composer (>=2.4 for `audit`)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli
          curl -sSL -o "$HOME/bin/composer" https://getcomposer.org/download/2.10.3/composer.phar
          chmod +x "$HOME/bin/composer"
          composer --version
          # Java deps are covered by osv-scanner (installed above) — no extra tool
      - name: Prove detection (secrets / sast / deps / iac + Go, Rust, Ruby, PHP, Java)
        env:
          VIBESAFE_LIVE: "1"
        run: python -m unittest tests.test_live_detection -v
