name: vibesafe security scan
description: Run vibesafe's multi-scanner audit and optionally gate on severity.
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Path to scan.
    default: "."
  fail-on:
    description: >-
      Fail (non-zero) if a finding at or above this severity is shown
      (critical|high|medium|low|info). Empty = never fail.
    default: ""
  only:
    description: Comma list of categories (secrets,deps,sast,iac,license).
    default: ""
  timeout:
    description: Per-tool timeout in seconds.
    default: "120"
  upload-sarif:
    description: 'If "true", upload report.sarif to GitHub code scanning (needs security-events write permission).'
    default: "false"
runs:
  using: composite
  steps:
    - name: Run vibesafe scan
      shell: bash
      # Inputs go through env, never `${{ }}` in the script body (script injection).
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -eo pipefail
        args=("$INPUT_PATH" --out-dir "$RUNNER_TEMP/vibesafe" --timeout "$INPUT_TIMEOUT")
        [ -n "$INPUT_FAIL_ON" ] && args+=(--fail-on "$INPUT_FAIL_ON")
        [ -n "$INPUT_ONLY" ] && args+=(--only "$INPUT_ONLY")
        python3 "$GITHUB_ACTION_PATH/scripts/scan.py" "${args[@]}"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vibesafe-report
        path: ${{ runner.temp }}/vibesafe/report.*
        if-no-files-found: ignore
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ runner.temp }}/vibesafe/report.sarif
